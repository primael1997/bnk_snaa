<VirtualHost *:80>

    ServerName snaa-bnk.local
    DocumentRoot /var/www/bnk_snaa/public

    <Directory /var/www/bnk_snaa/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/bnk_snaa_error.log
    CustomLog ${APACHE_LOG_DIR}/bnk_snaa_access.log combined

</VirtualHost>
